<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumio Booking</title>
<style>
  html,body{margin:0;height:100%;background:#0b1120;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;padding:24px;text-align:center}
  .dot{width:10px;height:10px;border-radius:50%;background:#6366f1;display:inline-block;animation:p 1s infinite alternate}
  @keyframes p{from{opacity:.3}to{opacity:1}}
</style>
</head>
<body>
<main><div><span class="dot"></span><p style="color:#94a3b8;font-size:14px;margin-top:14px">Đang mở Lumio…</p></div></main>
<script>location.replace('https://lumiobooking.com/salon');</script>
</body>
</html>
