<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><title>Lumio — ghép chú thích ảnh store</title>
<style>
body{font-family:system-ui,sans-serif;background:#0f172a;color:#e2e8f0;margin:0;padding:20px}
.row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
input[type=text]{padding:10px;border-radius:8px;border:1px solid #334155;background:#111827;color:#fff;min-width:320px;font-size:15px}
button{padding:10px 16px;border-radius:8px;border:0;background:#6366f1;color:#fff;font-weight:700;cursor:pointer}
canvas{max-height:70vh;border:1px solid #334155;border-radius:12px}
</style></head><body>
<h2>Ghép chú thích lên ảnh màn hình (1320×2868)</h2>
<div class="row">
  <input type="file" id="f" accept="image/png,image/jpeg">
  <input type="text" id="t" placeholder="Chú thích, ví dụ: Your whole day, by technician">
  <input type="text" id="s" placeholder="Dòng phụ (tuỳ chọn)">
  <button id="go">Vẽ</button><button id="dl">Tải về PNG</button>
</div>
<canvas id="c" width="1320" height="2868"></canvas>
<script>
const c=document.getElementById('c'),ctx=c.getContext('2d');let img=null;
document.getElementById('f').onchange=e=>{const fr=new FileReader();fr.onload=()=>{img=new Image();img.onload=draw;img.src=fr.result};fr.readAsDataURL(e.target.files[0])};
document.getElementById('go').onclick=draw;
document.getElementById('dl').onclick=()=>{const a=document.createElement('a');a.download='screenshot.png';a.href=c.toDataURL('image/png');a.click()};
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
  const W=c.width,H=c.height;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1120');g.addColorStop(1,'#1e1b4b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const t=document.getElementById('t').value||'',s=document.getElementById('s').value||'';
  ctx.fillStyle='#fff';ctx.font='bold 88px system-ui, -apple-system, Segoe UI, Roboto, sans-serif';ctx.textAlign='center';
  wrap(t,W/2,260,W-160,100);
  if(s){ctx.fillStyle='#a5b4fc';ctx.font='48px system-ui, sans-serif';wrap(s,W/2,470,W-200,60)}
  if(img){const top=s?600:540,pad=90,w=W-pad*2,h=w*(img.height/img.width);ctx.save();rr(pad,top,w,Math.min(h,H-top+200),64);ctx.clip();ctx.drawImage(img,pad,top,w,h);ctx.restore();ctx.strokeStyle='rgba(255,255,255,.18)';ctx.lineWidth=6;rr(pad,top,w,Math.min(h,H-top+200),64);ctx.stroke()}
}
function wrap(text,x,y,maxW,lh){const words=text.split(' ');let line='';for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxW&&line){ctx.fillText(line,x,y);line=w;y+=lh}else line=test}if(line)ctx.fillText(line,x,y)}
</script></body></html>
