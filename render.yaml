# ===========================================================================
# Render Blueprint for Lumio Booking (monorepo: NestJS API + Next.js web).
# One push to GitHub -> Render rebuilds & redeploys both services.
# Database is hosted on Neon (set DATABASE_URL below).
#
# Env vars marked "sync: false" must be filled in the Render dashboard
# (or when you first apply the blueprint). See DEPLOY.md for the walkthrough.
# ===========================================================================
services:
  # ---------------------- Backend API (NestJS, /api) ----------------------
  - type: web
    name: lumio-api
    runtime: node
    # Stated explicitly, and it must stay Oregon: this is where the service
    # already runs. Leaving it out would let a blueprint sync move a live
    # service to Render's default region, which means new URLs and downtime for
    # salons who are open right now.
    region: oregon
    # Watches `production`, NOT `main`.
    #
    # Pushing code reaches Vietnam and stops there, because Vietnam watches
    # `main` and this does not. The US salons receive a change only when
    # `main` is merged into `production` — a deliberate act, recorded in git,
    # with a date and a commit you can point at when something goes wrong.
    #
    # Auto-deploy stays ON: the gate is the branch, not a switch in a
    # dashboard. Nobody has to remember to press anything, and nobody can
    # forget to press it either.
    branch: production
    autoDeploy: true
    # Starter ($7/mo) so the API never sleeps (no cold start). Keep this in the
    # blueprint so a deploy never silently reverts it to free.
    plan: starter
    rootDir: .
    # install whole workspace -> generate Prisma client -> build -> run migrations
    # install -> generate Prisma client -> RUN THE GUARD TESTS -> build -> migrate.
    #
    # The tests run BEFORE the build on purpose. They lock the behaviour US and
    # Canadian salons already depend on — money, phone numbers, dates, and the
    # gates on the sales bot — so a change that quietly alters any of it fails
    # the deploy instead of reaching a customer. Every case in them is a real
    # sentence or a real amount from production.
    #
    # --if-present is not decoration. A blueprint reads render.yaml from `main`,
    # but each service builds the commit on ITS OWN branch, so the build command
    # can be newer than the code it runs. The first sync after this file gained
    # the test step proved it: the US services build `production`, which then
    # predated the script, and both deploys died on "Missing script:
    # test:guards" — a safety net jamming the machine it was added to protect.
    # With --if-present an older commit skips the step; a commit that HAS the
    # script still runs it, and a failing test still stops the deploy.
    buildCommand: >-
      npm install --include=dev &&
      npm run db:generate --workspace=apps/api &&
      npm run test:guards --if-present &&
      npm run build --workspace=apps/api &&
      npm run db:migrate:deploy --workspace=apps/api
    startCommand: node apps/api/dist/src/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Which market this instance serves. Shown on /api/health next to a
      # fingerprint of the database, so "am I looking at the right system?"
      # is a five-second question with a definite answer.
      - key: MARKET
        value: US
      # Neon connection string (postgresql://...?sslmode=require). Secret.
      - key: DATABASE_URL
        sync: false
      # Auto-generated strong secret for signing JWTs.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: EMAIL_PROVIDER
        value: mock
      # Brevo (HTTPS email API) — recommended for reliable sending from the cloud.
      # Sign up free at brevo.com, verify a sender, paste the API key here.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: Lumio Booking
      # Platform Gmail (OAuth2 — same as WP Mail SMTP's Google mailer). Free, works
      # over HTTPS so it isn't blocked like SMTP. Fill all 4 to enable.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER_EMAIL
        sync: false
      - key: GMAIL_SENDER_NAME
        value: Lumio Booking
      # SMS: leave SMS_PROVIDER unset/blank — Twilio auto-enables once the
      # TWILIO_* vars below are filled. Set to "mock" to force-disable real SMS.
      - key: SMS_PROVIDER
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      # Use ONE sender: a Messaging Service (recommended, handles STOP/HELP) ...
      - key: TWILIO_MESSAGING_SERVICE_SID
        sync: false
      # ... or a single toll-free/long-code number in E.164 (e.g. +18337195153).
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: PAYMENT_PROVIDER
        value: mock
      # ---- Self-serve SaaS billing (subscriptions) ----
      # Public base URL of the web app, used for checkout success/cancel links.
      - key: APP_URL
        value: https://lumiobooking.com
      # Web Push (VAPID): new-booking alerts on the owner's phone even when the
      # app is closed. Generate a keypair (npx web-push generate-vapid-keys) and
      # paste below in the Render dashboard. Leave blank to keep push disabled.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@lumiobooking.com
      # Stripe: secret key (sk_live_…) + webhook signing secret (whsec_…).
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # PayPal: REST app credentials + webhook id. PAYPAL_ENV = live | sandbox.
      - key: PAYPAL_ENV
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      # Comma-separated allowed frontend origins. Set to the web URL after the
      # first deploy, e.g. https://lumio-web.onrender.com
      - key: CORS_ORIGINS
        sync: false
      # ---- Keep-alive (anti cold-start on the free tier) ----
      # The API pings itself (RENDER_EXTERNAL_URL is injected automatically) and
      # the web app to keep both warm during business hours. Set KEEPALIVE_WEB_URL
      # to your web service URL. Tune the window/timezone to your salons' hours.
      # On a paid plan that never sleeps, set KEEPALIVE_ENABLED=false.
      - key: KEEPALIVE_ENABLED
        value: "true"
      - key: KEEPALIVE_WEB_URL
        value: https://lumio-web-1xqk.onrender.com
      # US/Canada: 10:00–21:00 US Eastern = 07:00–18:00 Pacific. ~11h window keeps
      # both services under Render's 750 free instance-hours/month budget.
      - key: KEEPALIVE_START_HOUR
        value: "10"
      - key: KEEPALIVE_END_HOUR
        value: "21"
      - key: KEEPALIVE_TZ
        value: America/New_York

  # ---------------------- Frontend (Next.js dashboard) --------------------
  - type: web
    name: lumio-web
    runtime: node
    region: oregon
    # Same branch as the API it talks to, for the same reason.
    branch: production
    autoDeploy: true
    # Paid (Starter, $7/mo) so a blueprint deploy never silently reverts it to
    # free (which would sleep + cold-start). Pinned here like the API service.
    plan: starter
    rootDir: .
    # Raise Node's heap ceiling for `next build` so it doesn't die with
    # "JavaScript heap out of memory" as the app grows (the build machine has
    # headroom even though the runtime instance is small).
    # Tests before the build here too: the price boxes a salon types into live
    # in the web app, and that is the half that was wrong for a whole currency.
    buildCommand: npm install --include=dev && npm run test:guards --if-present && NODE_OPTIONS=--max-old-space-size=4096 npm run build --workspace=apps/web
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # No NEXT_PUBLIC_MARKET here on purpose: the US dashboard shows no badge,
      # so nothing about the system that is already running changes.
      # Base URL of the API INCLUDING the /api suffix. Baked in at build time,
      # so set it before the first web build, e.g.
      #   https://lumio-api.onrender.com/api
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # =========================================================================
  # VIETNAM — a SECOND deployment of the SAME code, with its own database.
  # =========================================================================
  #
  # Why a separate service instead of a flag, and why not a separate branch.
  #
  # The US and Canadian salons are running a business on this software today. A
  # mistake made while building for a new market must not be able to reach them,
  # and a flag inside one process cannot promise that: a bad migration, a memory
  # leak or a crash loop takes down whoever shares the process. Separate service
  # and separate database means the blast radius of anything done for Vietnam
  # stops at Vietnam.
  #
  # But NOT a separate branch. One person maintaining two branches is two
  # branches drifting apart, and then every fix has to be made twice and
  # remembered twice. Both services build the SAME commit from `main`. The
  # isolation is at runtime and in the data, not in the source.
  #
  # That also makes Vietnam a proving ground, and the mechanism is the BRANCH
  # rather than a switch: these two watch `main`, the US two watch
  # `production`. A push lands in Vietnam and goes no further. The US receives
  # it when `main` is merged into `production` — one command, recorded in git,
  # so there is always an answer to "which version are the paying salons on?".
  #
  # WHAT YOU MUST SET UP ONCE, in the Render dashboard:
  #   1. A NEW Neon database. Never point this at the US connection string —
  #      that is the one mistake this whole arrangement exists to prevent.
  #   2. DATABASE_URL     -> the new Neon string
  #   3. CORS_ORIGINS     -> https://lumio-web-vn.onrender.com
  #   4. NEXT_PUBLIC_API_URL on the web service -> https://lumio-api-vn.onrender.com/api
  #   5. Everything else (Twilio, Stripe, Brevo…) can start empty; a Vietnamese
  #      salon taking cash and messaging on Messenger needs none of it on day one.
  - type: web
    name: lumio-api-vn
    runtime: node
    # Singapore, to sit beside the Neon database created in the same region.
    # A server and its database belong together: every page asks the database
    # several times and waits for each answer, so splitting the pair across the
    # Pacific costs more than putting both on the far side of it.
    region: singapore
    # Watches `main`: every push lands here first, which is what makes Vietnam
    # the place a change is seen working before the US ever receives it.
    branch: main
    # Free while there are no paying Vietnamese salons. Raise it to starter the
    # day one of them depends on it — free instances sleep, and a sleeping API
    # means a customer's booking page spins for thirty seconds.
    plan: free
    rootDir: .
    autoDeploy: true
    buildCommand: >-
      npm install --include=dev &&
      npm run db:generate --workspace=apps/api &&
      npm run test:guards --if-present &&
      npm run build --workspace=apps/api &&
      npm run db:migrate:deploy --workspace=apps/api
    startCommand: node apps/api/dist/src/main.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MARKET
        value: VN
      # A DIFFERENT Neon database from the US one. Check this twice.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRES_IN
        value: 7d
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: CORS_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Left blank on purpose until they are actually needed here.
      - key: BREVO_API_KEY
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      # Keep-alive follows Vietnamese opening hours, not New York's.
      - key: KEEPALIVE_START_HOUR
        value: "8"
      - key: KEEPALIVE_END_HOUR
        value: "22"
      - key: KEEPALIVE_TZ
        value: Asia/Ho_Chi_Minh

  - type: web
    name: lumio-web-vn
    runtime: node
    region: singapore
    branch: main
    plan: free
    rootDir: .
    autoDeploy: true
    # Tests before the build here too: the price boxes a salon types into live
    # in the web app, and that is the half that was wrong for a whole currency.
    buildCommand: npm install --include=dev && npm run test:guards --if-present && NODE_OPTIONS=--max-old-space-size=4096 npm run build --workspace=apps/web
    startCommand: cd apps/web && npx next start -p $PORT
    envVars:
      - key: NODE_ENV
        value: production
      # Puts a red VIỆT NAM badge in the dashboard so two identical-looking
      # tabs can never be confused for one another. Baked in at build time.
      - key: NEXT_PUBLIC_MARKET
        value: VN
      # Must point at lumio-api-vn, never at the US API.
      - key: NEXT_PUBLIC_API_URL
        sync: false

