<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lumio Booking</title>
<style>
  html,body{margin:0;height:100%;background:#0b1120;color:#e2e8f0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{min-height:100%;display:grid;place-items:center;padding:28px;text-align:center}
  h1{font-size:20px;margin:14px 0 6px}
  p{color:#94a3b8;font-size:14px;line-height:1.5;margin:0 0 18px}
  button{background:#6366f1;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-size:16px;font-weight:700;width:100%;max-width:320px}
</style>
</head>
<body>
<main>
  <div>
    <div style="font-size:44px">📶</div>
    <h1>Không có kết nối · No connection</h1>
    <p>Kiểm tra Wi-Fi hoặc 4G rồi thử lại.<br>Check Wi-Fi or mobile data and try again.</p>
    <button onclick="location.replace('https://lumiobooking.com/salon')">Thử lại · Retry</button>
  </div>
</main>
</body>
</html>
