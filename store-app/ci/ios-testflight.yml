# Build the Lumio Booking iOS app in the cloud and send it to TestFlight —
# no Mac needed. Run it from GitHub → Actions → "iOS → TestFlight" → Run workflow.
#
# One-time setup (secrets, certificate, profile): docs/app-store/cloud-build-ios.md
#
# What it does: generate the iOS project from store-app/ (Capacitor), apply
# the Lumio settings (store-app/scripts/ios-prepare.mjs: name, iPad turning,
# push, privacy strings, signing), build, sign with the App Store certificate
# and profile kept in GitHub secrets, and upload to App Store Connect.
# The build then appears in App Store Connect → TestFlight after Apple's
# processing (10–30 min).
name: iOS → TestFlight

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version shown in the App Store (e.g. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 75
    defaults:
      run:
        working-directory: store-app
    env:
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest stable Xcode (App Store needs Xcode 26 or later)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the secrets are there
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=""
          for n in P12 P12_PASS PROFILE KEY_ID ISSUER KEY_P8; do [ -z "${!n}" ] && missing="$missing $n"; done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secrets:$missing — see docs/app-store/cloud-build-ios.md"
            exit 1
          fi
          [ "$HAS_FIREBASE" = "true" ] || echo "::warning::GOOGLE_SERVICE_INFO_PLIST_BASE64 not set — this build has NO push notifications."

      - name: Install
        run: |
          npm install --no-audit --no-fund
          command -v pod >/dev/null || sudo gem install cocoapods --no-document

      - name: Generate the iOS project
        run: |
          [ -d ios ] || npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#0b1120' --splashBackgroundColor '#0b1120' --splashBackgroundColorDark '#0b1120'

      - name: Firebase config (push notifications)
        if: env.HAS_FIREBASE == 'true'
        env:
          PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: echo "$PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist

      - name: Install the certificate and the App Store profile
        env:
          P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          echo "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$P12_PASS" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychain -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Read the profile: its name, UUID and team go into the build settings.
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          TEAM=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$RUNNER_TEMP/profile.plist")
          APPID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          if [ "$APPID" != "$TEAM.com.lumioagency.booking" ]; then
            echo "::error::The profile is for $APPID, not $TEAM.com.lumioagency.booking — create an App Store profile for com.lumioagency.booking."
            exit 1
          fi
          if ! /usr/libexec/PlistBuddy -c 'Print :Entitlements:aps-environment' "$RUNNER_TEMP/profile.plist" >/dev/null 2>&1; then
            echo "::error::The profile has no Push Notifications. Turn on Push Notifications for the App ID, then make (or edit and re-save) the profile and update IOS_PROFILE_BASE64."
            exit 1
          fi
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "IOS_PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "IOS_TEAM_ID=$TEAM" >> "$GITHUB_ENV"
          echo "Profile: $NAME ($UUID), team $TEAM"

      - name: Lumio settings (name, iPad turning, push, privacy, signing)
        run: node scripts/ios-prepare.mjs --release

      - name: Sync web assets and CocoaPods
        run: npx cap sync ios

      - name: Build (archive)
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            MARKETING_VERSION='${{ github.event.inputs.version }}' CURRENT_PROJECT_VERSION='${{ github.run_number }}' \
            archive | tail -n 80
          test -d "$RUNNER_TEMP/App.xcarchive" || { echo "::error::Archive failed — see the log above."; exit 1; }

      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${IOS_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>com.lumioagency.booking</key><string>${IOS_PROFILE_NAME}</string></dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect (TestFlight)
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APP_ID: ${{ vars.ASC_APP_ID }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          echo "$KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8"
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          # With Xcode 26.2+ altool may fail with "Cannot determine the Apple ID from Bundle ID":
          # set the repository variable ASC_APP_ID (the app's number in its App Store Connect URL).
          EXTRA=""
          [ -n "$APP_ID" ] && EXTRA="--apple-id $APP_ID"
          xcrun altool --upload-app --type ios --file "$IPA" --apiKey "$KEY_ID" --apiIssuer "$ISSUER" $EXTRA
          echo "Uploaded build ${{ github.run_number }} (version ${{ github.event.inputs.version }}). It shows in App Store Connect → TestFlight after processing."

      - name: Keep the .ipa (7 days)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lumio-booking-ios-${{ github.event.inputs.version }}-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7

      - name: Clean up the keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$HOME/.appstoreconnect/private_keys/"*.p8
